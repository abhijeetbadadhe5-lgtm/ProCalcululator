<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProCalc - Modern Desktop & Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="theme-dark">

  <!-- Background Ambient Glow -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="app-container">
    <!-- Calculator Window Frame -->
    <div class="calc-window" id="calculator">
      
      <!-- Window Title Bar -->
      <header class="window-titlebar">
        <div class="window-controls">
          <span class="control-dot close" title="Close"></span>
          <span class="control-dot minimize" title="Minimize"></span>
          <span class="control-dot maximize" title="Maximize"></span>
        </div>
        <div class="window-title">
          <svg class="calc-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-6 2h5v3h-5V5zm-7 0h5v3H6V5zm0 5h5v3H6v-3zm0 5h5v3H6v-3zm7 5v-3h5v3h-5zm5-5h-5v-3h5v3z"/>
          </svg>
          <span>ProCalc Desktop</span>
          <span class="mode-badge" id="angleModeBadge">DEG</span>
        </div>
        <div class="window-actions">
          <button id="soundToggle" class="icon-btn" title="Toggle Sound Feedback">
            <svg id="soundIcon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
          <button id="themeToggle" class="icon-btn" title="Toggle Dark/Light Mode">
            <svg id="themeIcon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
            </svg>
          </button>
          <button id="historyToggle" class="icon-btn" title="View History (H)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Mode Selector Bar -->
      <nav class="mode-tabs">
        <button class="tab-btn active" data-mode="standard">Standard</button>
        <button class="tab-btn" data-mode="scientific">Scientific</button>
        <div class="tab-indicator"></div>
      </nav>

      <!-- Main Display Screen -->
      <section class="calc-screen" id="calcScreen">
        <div class="screen-top-row">
          <div class="screen-flags">
            <span class="flag-chip" id="memFlag" style="display: none;">M</span>
            <span class="flag-chip" id="angleFlag">DEG</span>
          </div>
          <button id="copyBtn" class="copy-chip" title="Click to copy answer">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
              <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
            </svg>
            <span id="copyFeedback">Copy</span>
          </button>
        </div>
        
        <!-- Live Expression Formula -->
        <div class="expression-display" id="expressionDisplay" aria-live="polite"></div>
        
        <!-- Current Output Value -->
        <div class="output-display" id="outputDisplay" title="Click to copy">0</div>
      </section>

      <!-- Memory Toolbar -->
      <div class="memory-bar">
        <button class="mem-btn" data-action="mc" disabled title="Clear Memory (Ctrl+L)">MC</button>
        <button class="mem-btn" data-action="mr" disabled title="Recall Memory (Ctrl+R)">MR</button>
        <button class="mem-btn" data-action="m-plus" title="Add to Memory (Ctrl+P)">M+</button>
        <button class="mem-btn" data-action="m-minus" title="Subtract from Memory (Ctrl+Q)">M-</button>
        <button class="mem-btn" data-action="ms" title="Store in Memory (Ctrl+M)">MS</button>
      </div>

      <!-- Keypad Grid Wrapper -->
      <div class="keypad-wrapper">
        
        <!-- Scientific Panel (Toggled via Mode) -->
        <div class="scientific-panel" id="scientificPanel">
          <button class="key func-key" data-action="deg-rad" id="degRadBtn" title="Toggle Degrees / Radians">RAD</button>
          <button class="key func-key" data-action="factorial" title="Factorial (x!)">x!</button>
          <button class="key func-key" data-action="bracket-open">(</button>
          <button class="key func-key" data-action="bracket-close">)</button>
          
          <button class="key func-key" data-action="sin" title="Sine">sin</button>
          <button class="key func-key" data-action="cos" title="Cosine">cos</button>
          <button class="key func-key" data-action="tan" title="Tangent">tan</button>
          <button class="key func-key" data-action="power" title="x to power y (xʸ)">xʸ</button>

          <button class="key func-key" data-action="asin" title="Inverse Sine">sin⁻¹</button>
          <button class="key func-key" data-action="acos" title="Inverse Cosine">cos⁻¹</button>
          <button class="key func-key" data-action="atan" title="Inverse Tangent">tan⁻¹</button>
          <button class="key func-key" data-action="sqr" title="Square (x²)">x²</button>

          <button class="key func-key" data-action="log" title="Logarithm (base 10)">log</button>
          <button class="key func-key" data-action="ln" title="Natural Log (base e)">ln</button>
          <button class="key func-key" data-action="pi" title="Pi Constant (π)">π</button>
          <button class="key func-key" data-action="euler" title="Euler's Constant (e)">e</button>

          <button class="key func-key" data-action="sqrt" title="Square Root (√)">√</button>
          <button class="key func-key" data-action="cbrt" title="Cube Root (∛)">∛</button>
          <button class="key func-key" data-action="reciprocal" title="Reciprocal (1/x)">1/x</button>
          <button class="key func-key" data-action="abs" title="Absolute Value (|x|)">|x|</button>
        </div>

        <!-- Standard Keys Grid -->
        <div class="standard-grid">
          <!-- Row 1 -->
          <button class="key action-key clear-all" data-action="clear" title="All Clear (Escape)">AC</button>
          <button class="key action-key" data-action="clear-entry" title="Clear Entry (Delete)">CE</button>
          <button class="key action-key" data-action="backspace" title="Backspace (⌫)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/>
            </svg>
          </button>
          <button class="key op-key" data-action="divide" data-op="÷" title="Divide (/)">÷</button>

          <!-- Row 2 -->
          <button class="key num-key" data-val="7">7</button>
          <button class="key num-key" data-val="8">8</button>
          <button class="key num-key" data-val="9">9</button>
          <button class="key op-key" data-action="multiply" data-op="×" title="Multiply (*)">×</button>

          <!-- Row 3 -->
          <button class="key num-key" data-val="4">4</button>
          <button class="key num-key" data-val="5">5</button>
          <button class="key num-key" data-val="6">6</button>
          <button class="key op-key" data-action="subtract" data-op="-" title="Minus (-)">−</button>

          <!-- Row 4 -->
          <button class="key num-key" data-val="1">1</button>
          <button class="key num-key" data-val="2">2</button>
          <button class="key num-key" data-val="3">3</button>
          <button class="key op-key" data-action="add" data-op="+" title="Plus (+)">+</button>

          <!-- Row 5 -->
          <button class="key num-key" data-action="negate" title="Toggle Sign (±)">±</button>
          <button class="key num-key" data-val="0">0</button>
          <button class="key num-key" data-val="." title="Decimal Point (.)">.</button>
          <button class="key equals-key" data-action="calculate" title="Calculate (Enter or =)">=</button>
        </div>

      </div>

      <!-- History Drawer (Overlay Panel) -->
      <aside class="history-drawer" id="historyDrawer">
        <div class="history-header">
          <h3>Calculation History</h3>
          <div class="history-header-actions">
            <button id="clearHistoryBtn" class="text-btn danger" title="Clear All History">Clear</button>
            <button id="closeHistoryBtn" class="icon-btn-sm" title="Close Drawer">✕</button>
          </div>
        </div>
        <div class="history-list" id="historyList">
          <div class="history-empty">No history recorded yet</div>
        </div>
      </aside>

      <!-- Keyboard Shortcut Helper Bar -->
      <footer class="window-footer">
        <span>⌨️ Keyboard active: <kbd>0-9</kbd> <kbd>+ - * /</kbd> <kbd>Enter</kbd> <kbd>Esc</kbd> <kbd>⌫</kbd></span>
      </footer>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
